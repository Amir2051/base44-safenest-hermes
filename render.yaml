services:
  - type: web
    name: safenestt-api-staging
    runtime: python
    plan: free
    region: ohio
    repo: https://github.com/Amir2051/base44-safenest-hermes
    branch: safenestt-render-staging
    autoDeploy: false
    buildCommand: pip install -r custom_backend/requirements.txt
    startCommand: uvicorn custom_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_DB_POOL_MAX
        value: "5"
      - key: AUTH_CSRF_SECRET
        generateValue: true
      - key: CUSTOM_BACKEND_SERVICE_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: safenestt-migration-staging-db
          property: connectionString

databases:
  - name: safenestt-migration-staging-db
    plan: free
    region: ohio
    postgresMajorVersion: "18"
